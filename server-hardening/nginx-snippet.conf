# Tambahkan blok ini di config Nginx kamu, di dalam server block yang
# document root-nya mengarah ke folder public/ project Laravel.

# 1) Larang eksekusi PHP di folder storage (upload dokumen/gambar)
location ^~ /storage/ {
    location ~ \.php$ {
        deny all;
    }
}

# 2) Matikan directory listing
autoindex off;

# 3) Blokir akses ke file sensitif kalau tidak sengaja ter-deploy ke public/
location ~ /\.(env|git) {
    deny all;
}
